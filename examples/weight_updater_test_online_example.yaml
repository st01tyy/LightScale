main: weight_updater_test

training:
  output_dir: /path/to/output
  from_pretrained: /path/to/megatron_checkpoint

actor:
  tp: 4
  pp: 2
  cp: 1
  dp: 8
  weight_update_group_port: 65500

distributed_lock_server:
  port: 13266

weight_updater_test:
  online_test: true

async_rollout:
  actor_service_names:
    - actor_model
  services:
    - type: sglang
      name: actor_model
      resource_cfg:
        type: sglang
        is_gpu_resource: true
        base_port: 18580
        num_instances: 1
        params:
          model_path: /path/to/huggingface_model
          tp: 4
          enable_ep: false
          dist_base_port: 23380
      resources: []